[workspace]
members = [
    "crates/andromeda-cli",
    "crates/andromeda-core",
    "crates/andromeda-hardware",
    "crates/andromeda-policy",
    "crates/andromeda-runtime",
    "crates/andromeda-taskd",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/oratis/Andromeda"
rust-version = "1.85"

[workspace.dependencies]
andromeda-core = { path = "crates/andromeda-core" }
andromeda-hardware = { path = "crates/andromeda-hardware" }
andromeda-policy = { path = "crates/andromeda-policy" }
andromeda-runtime = { path = "crates/andromeda-runtime" }
andromeda-taskd = { path = "crates/andromeda-taskd" }
axum = "0.8.4"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.38", features = ["derive", "env"] }
fs4 = { version = "0.13.1", features = ["sync"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.45.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
