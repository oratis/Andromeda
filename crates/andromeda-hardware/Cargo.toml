[package]
name = "andromeda-hardware"
description = "Privacy-conscious hardware probe and HCM evaluator for Andromeda"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# For `encoding::{canonical_json, hex}` only: the manifest and capability
# signature schemes must agree byte for byte on how a typed value becomes a
# message, so both call one implementation instead of keeping a copy each.
andromeda-core.workspace = true
chrono.workspace = true
# Declared here (matching `andromeda-core`'s declaration, so the two resolve to
# one `Cargo.lock` entry) because only these two crates need ed25519, for
# detached HCM manifest and capability signature verification. Pure-Rust, no
# default `rand_core`/key-generation feature is enabled: the matcher only loads
# a fixed verifying key and verifies a detached signature, so no runtime RNG is
# ever invoked. `zeroize` keeps signing-key material from lingering in memory
# (used by the signing helper and future offline signing tooling).
ed25519-dalek = { version = "2.2.0", default-features = false, features = [
    "std",
    "zeroize",
] }
serde.workspace = true
serde_json.workspace = true
# Declared here (not in `[workspace.dependencies]`) because only this crate
# needs SHA-256, for pinned-artifact verification in the HCM matcher.
sha2 = "0.10.9"
thiserror.workspace = true

[lints]
workspace = true
