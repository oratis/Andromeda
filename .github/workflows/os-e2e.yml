name: Installable OS

on:
  workflow_dispatch:
  # Upstream-drift detector. Most of what this workflow consumes is NOT pinned:
  # the fedora-bootc base is a rolling tag, ~300 dnf packages float, and
  # ovmf/qemu/podman come from ubuntu-latest apt. Those inputs break without any
  # commit here -- the fedora-bootc `manifest unknown` outage (run 30702410393)
  # was discovered by an unrelated PR author, which is the worst possible place
  # to learn about it. A nightly run moves that discovery to a scheduled job.
  #
  # Two `schedule` properties are load-bearing and intentional: scheduled runs
  # fire only on the default branch, and the `paths:` filters below do NOT apply
  # to them. Drift must be caught on a day when nothing under os/** changed.
  # See docs/reviews/e2e-pipeline-review.md P0 #5 (prerequisite for the supply
  # chain work in P1 #8).
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/os-e2e.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "os/**"
  pull_request:
    paths:
      - ".github/workflows/os-e2e.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "os/**"

concurrency:
  # github.event_name is part of the key so the nightly schedule run and a push
  # to main -- which share github.ref -- cannot cancel each other. Without it,
  # `cancel-in-progress` would let any push to main silently kill the very
  # drift detection the schedule exists to provide, and vice versa.
  group: os-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# JOB SPLIT (docs/reviews/e2e-pipeline-review.md P1 #7).
#
# This used to be one 48-62 min job, so any flake in the 10-15 min install
# phase cost a full rebuild of the 32-42 min image to retry. `build` now stops
# at the ISO and hands its artifacts to `lifecycle`, making a re-run of the
# QEMU half ~13 min instead of ~48.
#
# It is TWO jobs, not three, and that is a hard constraint rather than a
# preference: test-hardware-matrix.sh boots qcow2 overlays whose backing file is
# the andromeda-test.qcow2 that test-install.sh leaves behind
# (test-hardware-matrix.sh:17,100). The matrix cannot be separated from the
# lifecycle test that produces its disk, so the only correct cut is
# `build | (lifecycle + matrix)`.
jobs:
  build:
    name: Build payloads and installer ISO
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The cross-run payload layer cache (P1 #6) lives in GHCR. Only push and
      # schedule runs ever publish to it (see the cache-publishing step below);
      # every pull_request run consumes it read-only, so this scope is inert
      # there -- and fork PRs never receive it regardless of what is declared
      # here.
      packages: write
    # TIMEOUT BUDGET INVARIANT, build half
    # (docs/reviews/e2e-pipeline-review.md P0 #4, re-derived for P1 #7).
    #
    # The invariant is unchanged -- every budget must nest inside the one above
    # it, so a genuinely slow run surfaces as a named stage timeout instead of an
    # unattributable job cancellation. Splitting the job splits the OUTERMOST
    # term in two, and each half now has to hold on its own:
    #
    #   free runner disk space                      5 min (observed 2.10-4.50)
    #   + apt install host deps                     2 min (observed 0.21-0.36)
    #   + validate scripts                          1 min (observed 0.01-0.03)
    #   + build payloads + ISO                     50 min (observed max 42.25)
    #   + publish layer cache to ghcr               5 min (new, P1 #6)
    #   + layer-size budget                         1 min
    #   + upload ISO 4.0 GiB + rev2 tar ~4 GiB      6 min (ISO alone: 0.31-0.74)
    #   + checkout, registry login                  1 min
    #   = 71 min                                    < 75 min (here)
    #
    # Build remains the one term with no enforced ceiling, so the ~50 min
    # assumption is written down: if it regresses past that, raise this number in
    # the same change. It no longer has to share a budget with 120 min of QEMU
    # work, which is what made the old single number so tight. A warm layer cache
    # is expected to put the build at ~18 min; this stays at 75 because a cold
    # cache (every fork PR, every week rollover, every cache miss) is the
    # supported path and must still fit.
    timeout-minutes: 75
    steps:
      # Pinning policy: first-party actions/* are pinned to major tags;
      # third-party actions are pinned to a full commit SHA.
      - uses: actions/checkout@v4

      - name: Free runner disk space
        # `docker-images: true` is KEPT deliberately alongside the new cross-run
        # payload cache. Review item #12 lists the two as conflicting; on
        # inspection they do not conflict, for two independent reasons:
        #
        #   1. The action's docker-images step runs `docker image prune --all
        #      --force`, which empties the DOCKER daemon's store. build-iso.sh
        #      drives rootful podman, whose store is /var/lib/containers/storage
        #      -- a different tree this never touches.
        #   2. The payload cache is not runner-local in the first place. It is
        #      restored mid-build by `podman build --cache-from` pulling from
        #      ghcr, strictly after this step, so even a podman-wide prune here
        #      could not evict it.
        #
        # Keeping it also matters more than it did before: this job now holds
        # restored cache layers, freshly built payload layers, a 4.0 GiB ISO and
        # a ~4 GiB OCI archive at once, so the ~4-5 GiB of pre-seeded docker
        # images is space the build actively needs.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          docker-images: true
          # The large-packages pass is the slow half of this action: a
          # multi-minute `apt-get remove` of dotnet/llvm/php/mongodb/mysql/
          # azure-cli/chrome/firefox/powershell/mono/gcloud. This job uses none
          # of those -- everything it needs is apt-installed explicitly below
          # -- and the android/haskell/dotnet/tool-cache/docker prunes already
          # free the bulk of the space, so skip it.
          large-packages: false

      - name: Install host dependencies
        # Build-side deps only. qemu/ovmf/binutils moved to the lifecycle job,
        # which is the only place they are used.
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman runc shellcheck
          sudo apt-get clean
          runtime="$(command -v runc)"
          printf 'PODMAN_RUNTIME=%s\nBUILDAH_RUNTIME=%s\n' \
            "${runtime}" "${runtime}" >> "$GITHUB_ENV"
          runc --version
          podman --version

      - name: Validate scripts
        run: |
          shellcheck os/scripts/*.sh os/scripts/lib/*.sh os/installer/*.sh \
            os/files/usr/libexec/*
          os/scripts/test-installer-platform-guard.sh
          # Static Containerfile layer-COUNT floor only; no image exists yet.
          # The layer-SIZE budget runs post-build below against real history.
          ANDROMEDA_LAYER_BUDGET_MODE=count \
            os/scripts/test-containerfile-layer-budget.sh

      - name: Resolve the payload layer cache identity
        # payload-cache-key.sh appends the ISO week to this base, so the repo
        # podman is actually pointed at is
        # ghcr.io/<owner>/andromeda-payload-cache/<ISO-year>w<ISO-week>. The week
        # rotation is the mandatory time bound: the payload installs ~300 dnf
        # packages from a rolling Fedora repo, and a cache that never expired
        # would freeze that package set and silently stop security updates from
        # reaching the built image. See the rationale at the top of
        # os/scripts/payload-cache-key.sh.
        env:
          CACHE_OWNER: ${{ github.repository_owner }}
        # Explicit `shell: bash` so this step runs with pipefail: under the
        # default shell, `payload-cache-key.sh | tee` would report tee's exit
        # status and mask a key-script failure.
        shell: bash
        run: |
          # GHCR paths must be lowercase; repository_owner preserves case.
          owner="$(printf '%s' "${CACHE_OWNER}" | tr '[:upper:]' '[:lower:]')"
          base="ghcr.io/${owner}/andromeda-payload-cache"
          printf 'ANDROMEDA_PAYLOAD_CACHE_REPO=%s\n' "${base}" \
            >> "$GITHUB_ENV"
          # One invocation only; the summary fields below are derived from the
          # same NAME=value lines rather than asking the script a second time,
          # which could disagree with what was just exported.
          key_output="$(
            ANDROMEDA_PAYLOAD_CACHE_REPO="${base}" \
              os/scripts/payload-cache-key.sh
          )"
          printf '%s\n' "${key_output}" | tee -a "$GITHUB_ENV"
          key_field() {
            sed -n "s/^${1}=//p" <<< "${key_output}"
          }
          {
            printf '### Payload layer cache\n\n'
            printf -- '- content hash: `%s`\n' \
              "$(key_field ANDROMEDA_PAYLOAD_CACHE_CONTENT_HASH)"
            printf -- '- week (forced invalidation): `%s`\n' \
              "$(key_field ANDROMEDA_PAYLOAD_CACHE_WEEK)"
            printf -- '- cache ref: `%s`\n' \
              "$(key_field ANDROMEDA_PAYLOAD_CACHE_RESOLVED_REF)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate for cache publishing (push and schedule runs only)
        # PUSH eligibility is decided by the EVENT, never by whether `podman
        # login` succeeds: ghcr accepts a login with a fork PR's read-only
        # GITHUB_TOKEN too, so a login-based probe misfires there -- every fork
        # PR would attempt the cache push, fail it, eat the loud cache-fallback
        # banner, and build twice. Only a push to main or the nightly schedule
        # may publish cache layers; every pull_request run, fork or same-repo,
        # is a read-only cache consumer. That is also the poisoning boundary:
        # no PR-triggered run ever holds ANDROMEDA_PAYLOAD_CACHE_PUSH=1, so
        # layers seeded from PR branches can no longer reach main's builds.
        #
        # Reads need no login: `--cache-from` pulls are best-effort inside
        # podman, so an absent or unreadable cache repo degrades to an ordinary
        # cache miss (at worst run_cached_build's cold retry), never a build
        # failure. Hence this step exists only where pushing is enabled, and a
        # failed login here downgrades the run to pull-only instead of failing.
        #
        # `sudo podman login` on purpose: build-iso.sh runs under sudo, and
        # rootful podman reads root's auth store, not the runner user's, so a
        # rootless login here would leave the build unauthenticated.
        if: github.event_name == 'push' || github.event_name == 'schedule'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          if printf '%s' "${GHCR_TOKEN}" \
            | sudo podman login ghcr.io \
                --username "${GHCR_USER}" --password-stdin; then
            printf 'ANDROMEDA_PAYLOAD_CACHE_PUSH=1\n' >> "$GITHUB_ENV"
            printf 'Payload layer cache: publishing enabled for this %s run.\n' \
              "${GITHUB_EVENT_NAME}"
          else
            printf 'ghcr login failed; not publishing cache layers this run.\n'
            printf 'The ghcr login failed, so this run published no payload cache layers; the build still consumed the cache read-only.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build payloads and installer ISO
        # INSTALLER_DEFAULT=1 makes the destructive automated install the
        # GRUB default so the unattended VM lifecycle can run; build-iso.sh
        # names that variant *-ci.iso so it is never mistaken for the safe
        # interactive Developer Preview ISO (default 0).
        #
        # The cache variables are forwarded through sudo because build-iso.sh
        # runs rootful; an empty ANDROMEDA_PAYLOAD_CACHE_REPO disables the cache
        # entirely, and a cache miss always falls back to a full build.
        # ANDROMEDA_PAYLOAD_CACHE_PUSH is set only by the push/schedule-gated
        # login step above, so PR runs (which never set it) build pull-only.
        # ANDROMEDA_PAYLOAD_CACHE_WEEK pins the week resolved once at the top
        # of this job, so a run that straddles the ISO-week rollover cannot
        # split its cache pulls and pushes across two week repos.
        env:
          INSTALLER_DEFAULT: "1"
        run: |
          sudo --preserve-env=PODMAN_RUNTIME,BUILDAH_RUNTIME,INSTALLER_DEFAULT,ANDROMEDA_PAYLOAD_CACHE_REPO,ANDROMEDA_PAYLOAD_CACHE_PUSH,ANDROMEDA_PAYLOAD_CACHE_WEEK \
            os/scripts/build-iso.sh "$GITHUB_WORKSPACE/output"

      - name: Enforce payload layer-size budget against real history
        # Stays in the BUILD job: it needs andromeda-v1-history.json, which
        # build-iso.sh has just written, and it must gate before the expensive
        # lifecycle job is dispatched at all.
        #
        # The count-only floor ran pre-build; now build-iso.sh has produced
        # andromeda-v1-history.json, so assert the largest real OCI layer fits
        # the installer /var/tmp overlay budget before the long install. `size`
        # mode FAILS (does not skip) if the history JSON is missing and always
        # prints ANDROMEDA_MAX_PAYLOAD_LAYER_BYTES_OBSERVED, so the real baseline
        # can be read from these logs and the 3 GiB headroom default tightened.
        # build-iso.sh ran under sudo; the history JSON is world-readable
        # (root umask 022), so this read-only check needs no privileges.
        env:
          ANDROMEDA_LAYER_BUDGET_MODE: size
        run: os/scripts/test-containerfile-layer-budget.sh "$GITHUB_WORKSPACE/output"

      - name: Upload installer
        # The uploaded ISO is the CI variant (*-ci.iso): its GRUB default is
        # the destructive automated install. The artifact name says so; do
        # not distribute it as a developer-facing preview image.
        #
        # This artifact is also the transfer medium for the lifecycle job, which
        # is why its contents and retention are unchanged.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Andromeda-Developer-Preview-x86_64-ci-${{ github.sha }}
          path: |
            output/*.iso
            output/*.sha256
            output/*.manifest.json
            output/andromeda-v1-history.json
          compression-level: 0
          retention-days: 3
          if-no-files-found: warn

      - name: Upload rev2 update payload
        # ~4 GiB OCI archive that test-install.sh serves to the guest over slirp
        # for the `bootc switch` half of the lifecycle. Separate from the
        # installer artifact because it is a pipeline-internal handoff, not
        # something a human should ever download -- hence the success-only
        # condition. Retention matches the installer artifact's 3 days: a
        # lifecycle-only re-run inside that window needs BOTH halves of the
        # transfer, and a shorter-lived tar would silently shrink it.
        #
        # The .sha256 rides along so the lifecycle job can verify the tar's
        # CONTENT survived the artifact round trip, not merely that a file
        # exists (see the verify step there).
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Andromeda-update-payload-${{ github.sha }}
          path: |
            output/andromeda-v2.tar
            output/andromeda-v2.tar.sha256
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  lifecycle:
    name: UEFI install, first boot, update, rollback, and hardware matrix
    needs: build
    runs-on: ubuntu-latest
    # TIMEOUT BUDGET INVARIANT, lifecycle half
    # (docs/reviews/e2e-pipeline-review.md P0 #4, re-derived for P1 #7).
    #
    # The guest-side chain is untouched by the split and still nests:
    #
    #   andromeda-ci-verify.service TimeoutStartSec  12 min
    #     < per-boot budget (unit + ~2 min boot)     14 min
    #   3 boots x 14 min                             42 min
    #     < test-install.sh boot deadline            45 min (2700 s)
    #
    # What changed is the outermost term, which no longer has to carry the
    # build:
    #
    #   free runner disk space                        5 min (observed 4.50 in
    #                                                 run 30732275955)
    #   + apt install host deps                       2 min
    #   + download ISO 4.0 GiB + rev2 tar ~4 GiB      6 min
    #   + test-install.sh install timeout            45 min
    #   + test-install.sh boot deadline              45 min
    #   + test-hardware-matrix.sh (3 x 600 s)        30 min
    #     (a host-side cap deliberately BELOW the 12 min andromeda-ci-verify
    #      unit timeout; test-hardware-matrix.sh explains why raising it to
    #      840 s would push this sum past the job timeout)
    #   + upload serial evidence (2 MiB)              1 min
    #   + checkout                                    1 min
    #   = 135 min                                     < 140 min (here)
    #
    # Both TCG fail-fast guards -- the "/dev/kvm is unavailable" messages in
    # test-install.sh and test-hardware-matrix.sh -- cite this budget: the TCG
    # matrix alone (3 x 3600 s = 180 min) exceeds these 140 minutes, so
    # refusing to run under TCG stays correct after the split.
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        # This job never runs podman, so pruning the docker image store is pure
        # gain here: it makes room for ~8 GiB of downloaded artifacts plus the
        # 64 GiB sparse install disk and the three matrix overlays.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          docker-images: true
          # Same rationale as the build job: the multi-minute apt-get remove
          # pass frees the least space, and nothing it removes is used here --
          # qemu/ovmf/binutils are apt-installed fresh in the next step.
          large-packages: false

      - name: Install host dependencies
        # QEMU-side deps only; nothing here builds an image, so podman/runc and
        # shellcheck stay in the build job. binutils supplies `strings` for the
        # OVMF NVRAM dump, qemu-utils supplies qemu-img and qemu-nbd.
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils ovmf qemu-system-x86 qemu-utils
          sudo apt-get clean
          qemu-system-x86_64 --version
          qemu-img --version

      - name: Download installer ISO and manifests
        uses: actions/download-artifact@v4
        with:
          name: Andromeda-Developer-Preview-x86_64-ci-${{ github.sha }}
          path: output

      - name: Download rev2 update payload
        uses: actions/download-artifact@v4
        with:
          name: Andromeda-update-payload-${{ github.sha }}
          path: output

      - name: Verify the transferred build artifacts
        # The split introduces a failure mode the monolithic job did not have: a
        # 4.0 GiB ISO and a ~4 GiB OCI archive now make a round trip through
        # artifact storage. build-iso.sh wrote a checksum for each, so
        # verifying them costs seconds and turns a truncated transfer into a
        # named failure here instead of an unexplained UEFI hang 45 minutes
        # later.
        #
        # The tar MUST be checked by content, not with a mere non-empty test: a
        # truncated andromeda-v2.tar would pass `-s`, and test-install.sh then
        # derives the fw_cfg digest by hashing that same truncated file, so the
        # guest-side verification would pass too and the corruption would only
        # surface as an opaque bootc failure deep inside the lifecycle.
        #
        # The globs are self-adjusting on purpose (no hardcoded ISO name), and
        # the manifest's own iso.sha256 claim is checked against the digest the
        # checksum file just proved, so a manifest that no longer describes the
        # ISO next to it cannot ride through unnoticed.
        working-directory: output
        run: |
          ls -l
          sha256sum --check ./*.iso.sha256 andromeda-v2.tar.sha256
          manifest_sha256="$(jq --raw-output '.iso.sha256' ./*.manifest.json)"
          iso_sha256="$(awk '{ print $1 }' ./*.iso.sha256)"
          if [[ -z "${iso_sha256}" || "${manifest_sha256}" != "${iso_sha256}" ]]; then
            printf 'Manifest iso.sha256 (%s) does not match the verified ISO digest (%s).\n' \
              "${manifest_sha256}" "${iso_sha256}" >&2
            exit 1
          fi

      - name: Install to a blank disk and verify lifecycle
        run: sudo os/scripts/test-install.sh "$GITHUB_WORKSPACE/output"

      - name: Verify pairwise virtual hardware matrix
        # Cannot be its own job: it boots qcow2 overlays backed by the
        # andromeda-test.qcow2 that the step above leaves in output/, so it must
        # share a runner with test-install.sh.
        run: sudo os/scripts/test-hardware-matrix.sh "$GITHUB_WORKSPACE/output"

      - name: Upload serial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Andromeda-serial-evidence-${{ github.sha }}
          # hardware-matrix/ is globbed by extension, not with **: each profile
          # directory also holds a disk.qcow2 overlay and an OVMF_VARS.fd that
          # would bloat the evidence artifact. *.log and *.txt cover everything
          # test-hardware-matrix.sh writes as text (qemu-version.txt,
          # qemu-img-version.txt, and per profile serial.log,
          # serial.normalized.log, qemu-argv.txt, qemu-img-check.txt,
          # qemu-img-check-status.txt).
          path: |
            output/install-serial.log
            output/boot-serial.log
            output/update-server.log
            output/esp-tree.txt
            output/install-post.log
            output/ovmf-vars.txt
            output/diagnostics/**
            output/hardware-matrix/**/*.log
            output/hardware-matrix/**/*.txt
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
