name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      # Pinning policy (matches os-e2e.yml): first-party actions/* are pinned to
      # major tags; third-party actions are pinned to a full commit SHA with a
      # trailing version comment.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.85.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: os/scripts/test-installer-platform-guard.sh
      - run: os/scripts/test-containerfile-layer-budget.sh
      - run: os/scripts/test-ci-timeout-budget.sh

  platform:
    name: Platform probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.85.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The quality job already runs the full test suite on ubuntu; skip the
      # duplicate run and keep only the platform-specific probe there.
      - run: cargo test --workspace --locked
        if: matrix.os != 'ubuntu-latest'
      - run: cargo run --locked --quiet --bin andromeda -- hardware probe
