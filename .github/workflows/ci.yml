name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Nightly pin-freshness probe. The check's pre-rot age warning is the one
  # signal that fires from time passing, not from commits: between PRs nothing
  # runs it, so a pin can cross its age budget in silence. Scheduled runs
  # execute ONLY the supply-chain job -- every other job carries an
  # `if: github.event_name != 'schedule'` guard. 03:30 is offset from
  # os-e2e.yml's 03:00 nightly so the two do not compete for runners.
  schedule:
    - cron: "30 3 * * *"

concurrency:
  # github.event_name is part of the key (same reasoning as os-e2e.yml): the
  # nightly schedule run and a push to main share github.ref and must not
  # cancel each other.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, and test
    # Scheduled runs are for the supply-chain job only; nothing here changes
    # overnight without a commit.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # Pinning policy (matches os-e2e.yml): first-party actions/* are pinned to
      # major tags; third-party actions are pinned to a full commit SHA with a
      # trailing version comment.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.85.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: os/scripts/test-installer-platform-guard.sh
      - run: os/scripts/test-containerfile-layer-budget.sh
      # Static, needs no VM and no built image, so it belongs with the other
      # guards here rather than in os-e2e.yml: the invariant it checks is about
      # os-e2e.yml itself, and learning it is violated after waiting for the
      # E2E runner would be learning it from the very timeout it prevents.
      # ci.yml also has no `paths:` filter, so a change to os-e2e.yml alone
      # still gets checked. Deliberately NOT duplicated into os-e2e.yml.
      - run: os/scripts/test-ci-timeout-budget.sh

  supply-chain:
    name: Container image pin freshness
    # This job also runs on the nightly schedule (see `on:` above) so the age
    # warning fires between PRs, not only when someone happens to push.
    runs-on: ubuntu-latest
    # The script bounds every registry lookup (--max-time + bounded retries),
    # so 10 minutes is generous; anything longer is a hang worth surfacing.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Deliberately ADVISORY, but NOT continue-on-error. This step reports on
      # the world outside the repository: whether upstream registries still
      # serve the digests os/Containerfile pins, and how old that content is.
      # Both answers can change without anybody touching this repo, so gating
      # merges on them would turn an unrelated PR red for a problem its author
      # did not cause and cannot fix in that PR -- which is precisely how the
      # fedora-bootc pin rot (Actions run 30702410393) was experienced. The
      # script's default mode therefore already exits 0 on findings; the signal
      # belongs on a dashboard, not in the merge gate.
      #
      # continue-on-error added nothing to that and was removed on purpose:
      # since advisory mode never fails on findings, the only thing it could
      # swallow was exit 2 -- usage/infrastructure breakage, i.e. "the check
      # itself is broken". Evidence that this matters: the run where the age
      # signal was silently dead (commit 1921496) was green. Gate-seeking
      # callers use --fail-on unresolvable (or --fail-on any).
      #
      # No apt step: ubuntu-latest ships skopeo, which the script prefers. Where
      # it is absent (a slimmer runner, or a macOS dev box) the script falls
      # back to the registry HTTP API over curl + jq. Both paths are exercised;
      # keep them that way, because the backends disagree on timestamp format.
      - run: os/scripts/check-pin-freshness.sh

  platform:
    name: Platform probe (${{ matrix.os }})
    # Scheduled runs are for the supply-chain job only.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.85.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The quality job already runs the full test suite on ubuntu; skip the
      # duplicate run and keep only the platform-specific probe there.
      - run: cargo test --workspace --locked
        if: matrix.os != 'ubuntu-latest'
      - run: cargo run --locked --quiet --bin andromeda -- hardware probe
