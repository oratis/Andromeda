name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      # Pinning policy (matches os-e2e.yml): first-party actions/* are pinned to
      # major tags; third-party actions are pinned to a full commit SHA with a
      # trailing version comment.
      - uses: actions/checkout@v4
      # Static, needs no VM, no built image, and no Rust toolchain -- only the
      # checkout -- so it runs FIRST, before the multi-minute cargo steps: the
      # invariant it checks is about os-e2e.yml itself, and the whole point of
      # keeping it in this job is ~1-minute feedback instead of learning about
      # a budget violation from the very timeout it prevents. ci.yml also has
      # no `paths:` filter, so a change to os-e2e.yml alone still gets
      # checked. Deliberately NOT duplicated into os-e2e.yml.
      - run: os/scripts/test-ci-timeout-budget.sh
      # Lint the shell harnesses outside the expensive os-e2e build job so a
      # script-only change gets shellcheck feedback here in seconds. Same file
      # set as os-e2e.yml's validate step, and deliberately kept in BOTH
      # places: os-e2e's nightly schedule run must stay self-contained, and
      # this job must catch script breakage without waiting for an E2E runner.
      # No apt step: the ubuntu-latest runner image ships shellcheck.
      - run: |
          shellcheck os/scripts/*.sh os/scripts/lib/*.sh os/installer/*.sh \
            os/files/usr/libexec/*
      - uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.85.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: os/scripts/test-installer-platform-guard.sh
      - run: os/scripts/test-containerfile-layer-budget.sh

  supply-chain:
    name: Container image pin freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deliberately NON-BLOCKING (continue-on-error). This step reports on the
      # world outside the repository: whether upstream registries still serve the
      # digests os/Containerfile pins, and how old that content is. Both answers
      # can change without anybody touching this repo, so gating merges on it
      # would turn an unrelated PR red for a problem its author did not cause and
      # cannot fix in that PR -- which is precisely how the fedora-bootc pin rot
      # (Actions run 30702410393) was experienced. The signal belongs on a
      # dashboard, not in the merge gate. Run it with --strict to make it a gate.
      #
      # No apt step: ubuntu-latest ships skopeo, which the script prefers. Where
      # it is absent (a slimmer runner, or a macOS dev box) the script falls
      # back to the registry HTTP API over curl + jq. Both paths are exercised;
      # keep them that way, because the backends disagree on timestamp format.
      - run: os/scripts/check-pin-freshness.sh
        continue-on-error: true

  platform:
    name: Platform probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.85.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The quality job already runs the full test suite on ubuntu; skip the
      # duplicate run and keep only the platform-specific probe there.
      - run: cargo test --workspace --locked
        if: matrix.os != 'ubuntu-latest'
      - run: cargo run --locked --quiet --bin andromeda -- hardware probe
